<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADMIN // CONTROL SYSTEM</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* --- STARK DARK THEME VARIABLES --- */
      :root {
        --bg-dark: #050505;
        --bg-panel: #0f0f0f;
        --accent-red: #ff2a2a;
        --accent-glow: rgba(255, 42, 42, 0.3);
        --text-main: #e0e0e0;
        --text-dim: #888888;
        --border-dim: #333333;
        --font-head: "Rajdhani", sans-serif;
        --font-body: "Roboto", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: var(--font-body);
        line-height: 1.6;
        min-height: 100vh;
        padding-bottom: 100px;
        overflow-x: hidden;
      }

      /* --- BACKGROUND FX --- */
      .background-grid {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: linear-gradient(
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 50px 50px;
        z-index: -2;
        pointer-events: none;
      }

      .scan-line {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 5px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent-red),
          transparent
        );
        opacity: 0.5;
        animation: scan 6s linear infinite;
        z-index: -1;
        pointer-events: none;
        box-shadow: 0 0 15px var(--accent-red);
      }

      @keyframes scan {
        0% {
          top: -10%;
        }
        100% {
          top: 110%;
        }
      }

      /* --- LAYOUT --- */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
        position: relative;
        z-index: 1;
      }

      .header-section {
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 20px;
        margin-bottom: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .page-title {
        font-family: var(--font-head);
        font-size: 2.5rem;
        font-weight: 700;
        color: white;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .page-title span {
        color: var(--accent-red);
      }

      .sys-status {
        font-family: var(--font-head);
        color: var(--text-dim);
        letter-spacing: 2px;
        font-size: 0.9rem;
      }

      /* --- BUTTONS --- */
      .actions-bar {
        margin-bottom: 40px;
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }

      .btn {
        padding: 12px 30px;
        font-family: var(--font-head);
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.3s;
        clip-path: polygon(
          10px 0,
          100% 0,
          100% calc(100% - 10px),
          calc(100% - 10px) 100%,
          0 100%,
          0 10px
        );
        border: none;
        font-size: 0.9rem;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .btn-primary {
        background: var(--accent-red);
        color: white;
      }
      .btn-primary:hover {
        background: white;
        color: var(--bg-dark);
        box-shadow: 0 0 15px var(--accent-red);
      }

      .btn-outline {
        background: rgba(255, 255, 255, 0.05);
        color: var(--text-dim);
      }
      .btn-outline:hover {
        background: var(--text-dim);
        color: var(--bg-dark);
      }

      .btn-add {
        width: 100%;
        margin-top: 20px;
        padding: 15px;
        background: rgba(255, 42, 42, 0.1);
        color: var(--accent-red);
        border: 1px dashed var(--accent-red);
        clip-path: none;
        font-family: var(--font-head);
        font-weight: 700;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: 0.3s;
      }
      .btn-add:hover {
        background: var(--accent-red);
        color: white;
      }

      .btn-remove {
        background: transparent;
        border: 1px solid var(--border-dim);
        color: var(--text-dim);
        font-size: 0.7rem;
        padding: 5px 10px;
        font-family: var(--font-head);
        letter-spacing: 1px;
        cursor: pointer;
        text-transform: uppercase;
        transition: 0.3s;
      }
      .btn-remove:hover {
        border-color: var(--accent-red);
        color: var(--accent-red);
      }

      /* --- TABS --- */
      .tabs-container {
        display: flex;
        border-bottom: 1px solid var(--border-dim);
        margin-bottom: 40px;
        overflow-x: auto;
      }

      .tab {
        padding: 15px 30px;
        background: transparent;
        border: none;
        color: var(--text-dim);
        font-family: var(--font-head);
        font-weight: 600;
        font-size: 1.1rem;
        cursor: pointer;
        transition: 0.3s;
        letter-spacing: 1px;
        border-bottom: 3px solid transparent;
        white-space: nowrap;
      }
      .tab:hover {
        color: white;
      }
      .tab.active {
        color: var(--accent-red);
        border-bottom-color: var(--accent-red);
        background: linear-gradient(
          to top,
          rgba(255, 42, 42, 0.05),
          transparent
        );
      }

      .tab-content {
        display: none;
        animation: fadeIn 0.4s ease-out;
      }
      .tab-content.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* --- FORMS --- */
      .form-section {
        background: var(--bg-panel);
        padding: 40px;
        border: 1px solid var(--border-dim);
        position: relative;
      }

      .section-heading {
        font-family: var(--font-head);
        font-size: 1.5rem;
        margin-bottom: 30px;
        border-left: 3px solid var(--accent-red);
        padding-left: 20px;
        text-transform: uppercase;
        color: white;
        letter-spacing: 1px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        gap: 25px;
        margin-bottom: 25px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-label {
        display: block;
        margin-bottom: 8px;
        color: var(--text-dim);
        font-family: var(--font-head);
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .form-input,
      .form-textarea {
        width: 100%;
        padding: 12px 15px;
        background: #050505;
        border: 1px solid var(--border-dim);
        color: var(--text-main);
        font-family: "Roboto", sans-serif;
        font-size: 0.95rem;
        transition: 0.3s;
      }
      .form-input:focus,
      .form-textarea:focus {
        outline: none;
        border-color: var(--accent-red);
        box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
      }
      .form-textarea {
        min-height: 100px;
        resize: vertical;
      }

      /* --- ITEMS (Cards) --- */
      .array-item {
        background: #0a0a0a;
        padding: 25px;
        margin-bottom: 25px;
        border: 1px solid var(--border-dim);
        transition: 0.3s;
        position: relative;
      }
      .array-item:hover {
        border-color: #444;
        transform: translateY(-2px);
      }
      .array-item::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 0;
        height: 2px;
        background: var(--accent-red);
        transition: 0.3s;
      }
      .array-item:hover::before {
        width: 100%;
      }

      .array-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-dim);
        padding-bottom: 10px;
      }
      .array-item-header h3 {
        font-family: var(--font-head);
        color: white;
        font-size: 1.1rem;
        letter-spacing: 1px;
      }

      /* --- NOTIFICATIONS --- */
      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 25px;
        background: var(--bg-panel);
        border-left: 4px solid var(--accent-red);
        color: white;
        font-family: var(--font-head);
        font-weight: 600;
        letter-spacing: 1px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
        display: none;
        z-index: 1000;
        animation: slideIn 0.3s ease-out;
      }
      .notification.success {
        border-color: var(--accent-red);
        color: white;
      }
      .notification.error {
        border-color: #ffaa00;
        color: #ffaa00;
      }
      @keyframes slideIn {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }

      .loading-bar {
        position: fixed;
        top: 0;
        left: 0;
        height: 3px;
        background: var(--accent-red);
        width: 0;
        z-index: 9999;
        transition: width 0.3s;
        box-shadow: 0 0 10px var(--accent-red);
      }
      .loading-bar.active {
        width: 100%;
      }

      .preview-frame {
        width: 100%;
        height: 800px;
        border: 1px solid var(--border-dim);
        background: white;
      }

      /* --- MOBILE --- */
      @media (max-width: 768px) {
        .header-section {
          flex-direction: column;
          text-align: center;
          gap: 15px;
        }
        .actions-bar {
          flex-direction: column;
        }
        .btn {
          width: 100%;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="background-grid"></div>
    <div class="scan-line"></div>
    <div class="loading-bar"></div>

    <div class="container">
      <div class="header-section">
        <div class="page-title">Admin<span>Panel</span></div>
        <div class="sys-status">SYSTEM STATUS: ONLINE // VER 2.0</div>
      </div>

      <div class="actions-bar">
        <button class="btn btn-primary" onclick="saveData()">
          Save Changes
        </button>
        <button class="btn btn-outline" onclick="previewPortfolio()">
          Live Preview
        </button>
        <button class="btn btn-outline" onclick="loadBackups()">Backups</button>
        <a href="/" target="_blank" class="btn btn-outline">Visit Live Site</a>
      </div>

      <div class="tabs-container">
        <button class="tab active" onclick="switchTab('basics')">
          BASIC INFO
        </button>
        <button class="tab" onclick="switchTab('skills')">SKILLS</button>
        <button class="tab" onclick="switchTab('experience')">
          EXPERIENCE
        </button>
        <button class="tab" onclick="switchTab('projects')">PROJECTS</button>
        <button class="tab" onclick="switchTab('preview')">LIVE PREVIEW</button>
      </div>

      <div id="basics-tab" class="tab-content active">
        <div class="form-section">
          <h2 class="section-heading">Identity Matrix</h2>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input
                type="text"
                class="form-input"
                id="basics-name"
                value="{{ data.basics.name }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Professional Title</label>
              <input
                type="text"
                class="form-input"
                id="basics-label"
                value="{{ data.basics.label }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label">CodeForces Rank</label>
              <input
                type="text"
                class="form-input"
                id="basics-cf_rank"
                value="{{ data.basics.cf_rank }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label">CodeChef Rating</label>
              <input
                type="text"
                class="form-input"
                id="basics-cc_rating"
                value="{{ data.basics.cc_rating }}"
                placeholder="e.g., 1800"
              />
            </div>
            <div class="form-group">
              <label class="form-label">CGPA</label>
              <input
                type="text"
                class="form-input"
                id="basics-cgpa"
                value="{{ data.basics.cgpa }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Problems Solved</label>
              <input
                type="text"
                class="form-input"
                id="basics-problems_solved"
                value="{{ data.basics.problems_solved }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Specialization</label>
              <input
                type="text"
                class="form-input"
                id="basics-specialization"
                value="{{ data.basics.specialization }}"
              />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Summary</label>
            <textarea class="form-textarea" id="basics-summary">
{{ data.basics.summary }}</textarea
            >
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label class="form-label">LinkedIn</label>
              <input
                type="text"
                class="form-input"
                id="basics-linkedin"
                value="{{ data.basics.linkedin }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label">GitHub</label>
              <input
                type="text"
                class="form-input"
                id="basics-github"
                value="{{ data.basics.github }}"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Email</label>
              <input
                type="email"
                class="form-input"
                id="basics-email"
                value="{{ data.basics.email }}"
              />
            </div>
          </div>
        </div>
      </div>

      <div id="skills-tab" class="tab-content">
        <div class="form-section">
          <h2 class="section-heading">Technical Arsenal</h2>
          <div id="skills-container"></div>
          <button class="btn btn-add" onclick="addSkill()">
            + Add New Skill
          </button>
        </div>
      </div>

      <div id="experience-tab" class="tab-content">
        <div class="form-section">
          <h2 class="section-heading">Mission Log</h2>
          <div id="experience-container"></div>
          <button class="btn btn-add" onclick="addExperience()">
            + Add Experience
          </button>
        </div>
      </div>

      <div id="projects-tab" class="tab-content">
        <div class="form-section">
          <h2 class="section-heading">Project Modules</h2>
          <div id="projects-container"></div>
          <button class="btn btn-add" onclick="addProject()">
            + Add Project
          </button>
        </div>
      </div>

      <div id="preview-tab" class="tab-content">
        <div class="form-section">
          <h2 class="section-heading">System Visuals</h2>
          <iframe
            id="preview-iframe"
            class="preview-frame"
            src="/admin/preview"
          ></iframe>
        </div>
      </div>
    </div>

    <div id="notification" class="notification"></div>

    <script>
      // --- INITIALIZATION ---
      // Data injected from backend Jinja2
      let portfolioData = {{ data | tojson }};

      // Safety checks for array existence
      if (!portfolioData.projects) portfolioData.projects = [];
      if (!portfolioData.experience) portfolioData.experience = [];
      if (!portfolioData.skills_bars) portfolioData.skills_bars = [];

      // --- NAVIGATION ---
      function switchTab(tabName) {
          const loadingBar = document.querySelector('.loading-bar');
          loadingBar.classList.add('active');

          // Deactivate all
          document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
          document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

          // Activate target
          const tabButtons = document.querySelectorAll('.tab');
          let targetBtn = null;

          // Map tabName to button index for highlighting
          if(tabName === 'basics') targetBtn = tabButtons[0];
          else if(tabName === 'skills') targetBtn = tabButtons[1];
          else if(tabName === 'experience') targetBtn = tabButtons[2];
          else if(tabName === 'projects') targetBtn = tabButtons[3];
          else if(tabName === 'preview') targetBtn = tabButtons[4];

          if(targetBtn) targetBtn.classList.add('active');
          document.getElementById(tabName + '-tab').classList.add('active');

          // Re-render data for the specific tab
          if (tabName === 'skills') renderSkills();
          if (tabName === 'experience') renderExperience();
          if (tabName === 'projects') renderProjects();
          if (tabName === 'preview') {
              const frame = document.getElementById('preview-iframe');
              frame.src = '/admin/preview?' + new Date().getTime();
          }

          setTimeout(() => loadingBar.classList.remove('active'), 300);
      }

      // --- RENDER FUNCTIONS ---

      function renderSkills() {
          const container = document.getElementById('skills-container');
          container.innerHTML = portfolioData.skills_bars.map((skill, index) => `
              <div class="array-item">
                  <div class="array-item-header">
                      <h3>SKILL #${String(index + 1).padStart(2, '0')}</h3>
                      <button class="btn-remove" onclick="removeSkill(${index})">REMOVE</button>
                  </div>
                  <div class="form-grid">
                      <div class="form-group">
                          <label class="form-label">Skill Name</label>
                          <input type="text" class="form-input" value="${skill.name}"
                                 onchange="portfolioData.skills_bars[${index}].name = this.value"
                                 placeholder="Python">
                      </div>
                      <div class="form-group">
                          <label class="form-label">Proficiency (%)</label>
                          <input type="number" class="form-input" value="${skill.level}" min="0" max="100"
                                 onchange="portfolioData.skills_bars[${index}].level = parseInt(this.value)"
                                 placeholder="90">
                      </div>
                  </div>
              </div>
          `).join('');
      }

      function renderExperience() {
          const container = document.getElementById('experience-container');
          container.innerHTML = portfolioData.experience.map((exp, index) => `
              <div class="array-item">
                  <div class="array-item-header">
                      <h3>LOG #${String(index + 1).padStart(2, '0')}</h3>
                      <button class="btn-remove" onclick="removeExperience(${index})">REMOVE</button>
                  </div>
                  <div class="form-grid">
                      <div class="form-group">
                          <label class="form-label">Duration</label>
                          <input type="text" class="form-input" value="${exp.dates}"
                                 onchange="portfolioData.experience[${index}].dates = this.value"
                                 placeholder="JAN 2025 - PRESENT">
                      </div>
                      <div class="form-group">
                          <label class="form-label">Role</label>
                          <input type="text" class="form-input" value="${exp.role}"
                                 onchange="portfolioData.experience[${index}].role = this.value"
                                 placeholder="Backend Engineer">
                      </div>
                  </div>
                  <div class="form-group">
                      <label class="form-label">Organization</label>
                      <input type="text" class="form-input" value="${exp.company}"
                             onchange="portfolioData.experience[${index}].company = this.value">
                  </div>
                  <div class="form-group">
                      <label class="form-label">Description</label>
                      <textarea class="form-textarea"
                                onchange="portfolioData.experience[${index}].description = this.value">${exp.description}</textarea>
                  </div>
              </div>
          `).join('');
      }

      function renderProjects() {
          const container = document.getElementById('projects-container');
          container.innerHTML = portfolioData.projects.map((project, index) => {
              // Formatting arrays for textarea display
              const bulletString = Array.isArray(project.bullet_points) ? project.bullet_points.join('\n') : '';
              const tagsString = Array.isArray(project.tags) ? project.tags.join(', ') : '';
              const dateVal = project.date || '';

              return `
              <div class="array-item">
                  <div class="array-item-header">
                      <h3>MODULE #${String(index + 1).padStart(2, '0')}</h3>
                      <button class="btn-remove" onclick="removeProject(${index})">REMOVE</button>
                  </div>
                  <div class="form-grid">
                      <div class="form-group">
                          <label class="form-label">Project Name</label>
                          <input type="text" class="form-input" value="${project.name}"
                                 onchange="portfolioData.projects[${index}].name = this.value">
                      </div>
                      <div class="form-group">
                          <label class="form-label">Completion Date</label>
                          <input type="text" class="form-input" value="${dateVal}"
                                 onchange="portfolioData.projects[${index}].date = this.value"
                                 placeholder="DEC 2025">
                      </div>
                  </div>
                  <div class="form-group">
                      <label class="form-label">GitHub URL</label>
                      <input type="url" class="form-input" value="${project.github_url}"
                             onchange="portfolioData.projects[${index}].github_url = this.value">
              </div>
                  <div class="form-group">
                      <label class="form-label">Brief Description</label>
                      <input type="text" class="form-input" value="${project.description}"
                                onchange="portfolioData.projects[${index}].description = this.value">
                  </div>
                  <div class="form-group">
                      <label class="form-label">Tech Stack (Comma Separated)</label>
                      <input type="text" class="form-input" value="${tagsString}"
                             onchange="portfolioData.projects[${index}].tags = this.value.split(',').map(t => t.trim())"
                             placeholder="Python, FastAPI, SQL">
                  </div>
                  <div class="form-group">
                      <label class="form-label">Key Features (One per line)</label>
                      <textarea class="form-textarea" rows="5"
                                placeholder="Feature 1&#10;Feature 2&#10;Feature 3"
                                onchange="updateProjectBullets(${index}, this.value)">${bulletString}</textarea>
                  </div>
              </div>
              `;
          }).join('');
      }

      // --- DATA HANDLERS ---

      function updateProjectBullets(index, textValue) {
          // Split newline, trim, remove empty
          const bullets = textValue.split('\n').map(line => line.trim()).filter(line => line !== '');
          portfolioData.projects[index].bullet_points = bullets;
      }

      function addSkill() {
          portfolioData.skills_bars.push({ name: "New Skill", level: 50 });
          renderSkills();
      }

      function removeSkill(index) {
          if(confirm("Confirm Deletion?")) {
              portfolioData.skills_bars.splice(index, 1);
              renderSkills();
          }
      }

      function addExperience() {
          portfolioData.experience.push({
              dates: "DATE", role: "ROLE", company: "ORG", description: "Description"
          });
          renderExperience();
      }

      function removeExperience(index) {
          if(confirm("Confirm Deletion?")) {
              portfolioData.experience.splice(index, 1);
              renderExperience();
          }
      }

      function addProject() {
          portfolioData.projects.push({
              name: "NEW PROJECT", date: "DATE",
              description: "Description", github_url: "",
              tags: ["Tag1"], bullet_points: ["Feature 1"]
          });
          renderProjects();
      }

      function removeProject(index) {
          if(confirm("Confirm Deletion?")) {
              portfolioData.projects.splice(index, 1);
              renderProjects();
          }
      }

      function collectBasicsData() {
          portfolioData.basics.name = document.getElementById('basics-name').value;
          portfolioData.basics.label = document.getElementById('basics-label').value;
          portfolioData.basics.cf_rank = document.getElementById('basics-cf_rank').value;
          portfolioData.basics.cgpa = document.getElementById('basics-cgpa').value;
          portfolioData.basics.problems_solved = document.getElementById('basics-problems_solved').value;
          portfolioData.basics.summary = document.getElementById('basics-summary').value;
          portfolioData.basics.specialization = document.getElementById('basics-specialization').value;
          portfolioData.basics.linkedin = document.getElementById('basics-linkedin').value;
          portfolioData.basics.github = document.getElementById('basics-github').value;
          portfolioData.basics.email = document.getElementById('basics-email').value;
          portfolioData.basics.cc_rating = document.getElementById('basics-cc_rating').value;
      }

      // --- API & UTILS ---

      async function saveData() {
          const loadingBar = document.querySelector('.loading-bar');
          loadingBar.classList.add('active');

          collectBasicsData();

          try {
              const response = await fetch('/api/data', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(portfolioData)
              });

              const result = await response.json();

              if (result.success) {
                  showNotification('SYSTEM UPDATED SUCCESSFULLY', 'success');
                  // Reload iframe
                  document.getElementById('preview-iframe').src = '/admin/preview?' + new Date().getTime();
              } else {
                  showNotification('UPDATE FAILED', 'error');
              }
          } catch (error) {
              showNotification('CONNECTION ERROR: ' + error.message, 'error');
          } finally {
              loadingBar.classList.remove('active');
          }
      }

      function previewPortfolio() {
          switchTab('preview');
      }

      async function loadBackups() {
          try {
              const response = await fetch('/api/backups');
              const data = await response.json();

              if (data.backups.length === 0) {
                  alert('NO BACKUPS FOUND');
                  return;
              }

              const backupList = data.backups.map(b =>
                  `${b.filename} (${new Date(b.modified).toLocaleString()})`
              ).join('\n');

              const selected = prompt('AVAILABLE RESTORE POINTS:\n\n' + backupList + '\n\nEnter filename:');

              if (selected) {
                  await restoreBackup(selected.trim());
              }
          } catch (error) {
              showNotification('BACKUP ERROR', 'error');
          }
      }

      async function restoreBackup(filename) {
          if (!confirm(`RESTORE SYSTEM TO ${filename}? CURRENT DATA WILL BE ARCHIVED.`)) return;

          try {
              const response = await fetch(`/api/restore/${filename}`, { method: 'POST' });
              const result = await response.json();

              if (result.success) {
                  showNotification('SYSTEM RESTORED', 'success');
                  setTimeout(() => location.reload(), 1500);
              } else {
                  showNotification('RESTORE FAILED', 'error');
              }
          } catch (error) {
              showNotification('RESTORE ERROR', 'error');
          }
      }

      function showNotification(message, type) {
          const notification = document.getElementById('notification');
          notification.textContent = message;
          notification.className = 'notification ' + type;
          notification.style.display = 'block';

          setTimeout(() => {
              notification.style.display = 'none';
          }, 3000);
      }

      // Keyboard Shortcut: Ctrl+S to save
      document.addEventListener('keydown', (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key === 's') {
              e.preventDefault();
              saveData();
          }
      });

      // Initial Render
      renderSkills();
      renderExperience();
      renderProjects();
    </script>
  </body>
</html>
